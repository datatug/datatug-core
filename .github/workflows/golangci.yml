name: Go CI

on:
  push:
    branches:
      - main
    paths:
      - 'go.*'
      - '**/*.go'
      - 'cmd/**'
      - 'web/**'
      - 'scripts/**'
      - 'LICENSE'
      - 'src/**'
      - '.github/workflows/*.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'
    paths:
      - 'go.*'
      - '**/*.go'
      - 'cmd/**'
      - 'web/**'
      - 'scripts/**'
      - 'LICENSE'
      - 'src/**'
      - '.github/workflows/*.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      code_coverage: true
      min_test_coverage_percent: 100

  validate_wasm:
    needs: strongo_workflow
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          check-latest: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install lockfile-pinned browser test dependency
        working-directory: web/recordsetcompare
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: web/recordsetcompare
        run: npx playwright install --with-deps chromium
      - name: Test source-bound release publisher guards
        run: python3 -m unittest discover -s scripts/recordsetcompare -p 'test_*.py'
      - name: Build linked module and deterministic package
        run: python3 scripts/recordsetcompare/build_release.py --output "$RUNNER_TEMP/recordsetcompare-package" --require-licenses
      - name: Verify package file hashes
        run: python3 scripts/recordsetcompare/verify_package.py "$RUNNER_TEMP/recordsetcompare-package"/*.tar.gz --source "$GITHUB_SHA"
      - name: Test packaged WASM in isolated Node workers
        env:
          COMPARE_PACKAGE_DIR: ${{ runner.temp }}/recordsetcompare-package/files
        run: npm run test:node --prefix web/recordsetcompare
      - name: Test packaged WASM in Chromium with same-origin CSP
        env:
          COMPARE_PACKAGE_DIR: ${{ runner.temp }}/recordsetcompare-package/files
        run: npm run test:browser --prefix web/recordsetcompare

  publish_wasm:
    needs: validate_wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Resolve one semver tag created by the existing Core CI tag owner
        id: source
        shell: bash
        run: |
          git fetch --force --tags origin
          tag="$(python3 scripts/recordsetcompare/resolve_source_tag.py --source "$GITHUB_SHA")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build source-bound deterministic package
        id: package
        env:
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          python3 scripts/recordsetcompare/build_release.py --output "$RUNNER_TEMP/recordsetcompare-package" --require-tag --require-licenses
          archive="$(find "$RUNNER_TEMP/recordsetcompare-package" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Verify source-bound package
        run: python3 scripts/recordsetcompare/verify_package.py "${{ steps.package.outputs.archive }}" --source "$GITHUB_SHA" --tag "${{ steps.source.outputs.tag }}"
      - name: Attest final archive bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Publish the immutable archive on the existing source-tag Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/recordsetcompare/publish_release_asset.py "${{ steps.source.outputs.tag }}" "${{ steps.package.outputs.archive }}"
