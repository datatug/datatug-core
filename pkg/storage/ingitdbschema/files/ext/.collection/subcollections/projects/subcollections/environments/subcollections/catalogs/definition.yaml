# Struct: datatug.DbCatalog (pkg/datatug/dbcatalog.go), the type
# filestore's environment DB catalogs store
# (pkg/storage/filestore/env_db_catalogs_store.go) persists — NOT
# datatug.EnvDb, which this package's DbCatalogsStore does not use. DbCatalog
# embeds DbCatalogBase (id/title/... via ProjectItem, plus driver/path/
# dbModel) and adds Schemas. id required, title optional:
# DbCatalogBase.Validate() calls ValidateWithOptions(false). driver is
# required (DbCatalogBase.Validate() errors on ""); path is required only
# when driver == "sqlite3" (conditional, left optional here); dbModel is
# never validated as required despite lacking `omitempty` on its tag.
# Schemas has NO json tag at all, so encoding/json uses the literal Go
# field name "Schemas" (capitalized) as the JSON key — an existing
# filestore quirk, reproduced here rather than corrected, since this
# collection declares today's actual on-disk shape.
record_file:
    name: '{key}/{key}.db.json'
    format: json
    type: map[string]any
    records_dir: '.'
columns:
    id:
        type: string
        required: true
    title:
        type: string
    folder:
        type: string
    tags:
        type: '[]string'
    userIds:
        type: '[]string'
    access:
        type: string
    driver:
        type: string
        required: true
    path:
        type: string
    dbModel:
        type: string
    Schemas:
        type: any
