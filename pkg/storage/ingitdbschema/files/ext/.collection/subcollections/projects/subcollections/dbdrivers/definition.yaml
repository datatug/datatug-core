# Struct: datatug.ProjDbDriver (pkg/datatug/server.go), the type filestore's
# db drivers store (pkg/storage/filestore/proj_dbdrivers_store.go)
# persists. id and title are required: ProjDbDriver.Validate() calls
# ValidateWithOptions(true). This used to be a gap (the promoted
# ListOfTags.Validate() ran instead and checked only tags) but
# ProjDbDriver.Validate() was fixed to call ValidateWithOptions directly.
# servers is a slice of nested ProjDbServer structs; `any` is the closest
# supported inGitDB type. It duplicates the dbservers subcollection this
# Feature also declares (founder decision, 2026-09-17: keep both as the
# schema has them today; resolving the duplication is a later question).
record_file:
    name: '{key}/{key}.dbdriver.json'
    format: json
    type: map[string]any
    records_dir: '.'
columns:
    id:
        type: string
        required: true
    title:
        type: string
        required: true
    folder:
        type: string
    tags:
        type: '[]string'
    userIds:
        type: '[]string'
    access:
        type: string
    servers:
        type: any
